name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Show available versions of optional deps
        continue-on-error: true
        run: |
          echo "== Mod Menu"; curl -s https://maven.terraformersmc.com/releases/com/terraformersmc/modmenu/maven-metadata.xml | grep -o '<version>[^<]*</version>' | tail -8
          echo "== YACL"; curl -s https://maven.isxander.dev/releases/dev/isxander/yet-another-config-lib/maven-metadata.xml | grep -o '<version>[^<]*1\.21\.1[01][^<]*</version>' | tail -8
          echo "== YACL beta"; curl -s https://beta.maven.isxander.dev/releases/dev/isxander/yet-another-config-lib/maven-metadata.xml | grep -o '<version>[^<]*1\.21\.1[01][^<]*</version>' | tail -8
          echo "== Fabric API"; curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o '<version>[^<]*1\.21\.11</version>' | tail -3

      - name: Build
        run: chmod +x gradlew && ./gradlew build --stacktrace --no-daemon

      - name: Inspect Minecraft method names (diagnostic)
        continue-on-error: true
        run: |
          find ~/.gradle/caches/fabric-loom -name '*.jar' -size +5M 2>/dev/null | head -20
          JAR=$(find ~/.gradle/caches/fabric-loom -name 'minecraft-merged*.jar' -o -name 'minecraft-project-@*.jar' 2>/dev/null | head -1)
          [ -z "$JAR" ] && JAR=$(find ~/.gradle/caches/fabric-loom -name '*.jar' -size +20M | head -1)
          echo "USING $JAR"
          for c in net.minecraft.world.entity.LivingEntity net.minecraft.world.entity.player.Player net.minecraft.world.entity.monster.Creeper net.minecraft.client.MouseHandler net.minecraft.client.gui.Gui net.minecraft.world.entity.player.Abilities net.minecraft.world.entity.ai.attributes.Attributes net.minecraft.world.entity.Entity; do
            echo "=== $c"; javap -p -cp "$JAR" $c | grep -E "getSpeed|decreaseAirSupply|increaseAirSupply|canBeAffected|onScroll|swell|ignite|explode|Swell|isIgnited|AIR|WATER_MOVEMENT|setFlyingSpeed|onUpdateAbilities|getJumpPower|getJumpBoost|hurtServer|isInWater|getAirSupply|setAirSupply|getMaxAirSupply|renderAirBubbles|renderPlayerHealth|renderHotbar|getFlyingSpeed|aiStep|addEffect|isFood|fallDistance|startSwell|startIgnite|isSwimming|ENTITY_INTERACTION|JUMP_STRENGTH" ; done
          javap -p -cp "$JAR" net.minecraft.world.effect.MobEffects | head -60
          javap -p -cp "$JAR" net.minecraft.world.damagesource.DamageTypes | head -60
          javap -p -cp "$JAR" net.minecraft.client.gui.contextualbar.ContextualBarRenderer 2>&1 | head; ls ~/.gradle/caches/fabric-loom || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: monk-mod-jar
          path: build/libs/*.jar

      - name: Publish jar to the latest release and to the jar branch
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -E 'sources|dev' | head -1)
          cp "$JAR" /tmp/monk.jar
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest /tmp/monk.jar --title "Monk Mod (latest build)" --notes "Build automatico do commit ${GITHUB_SHA::7}" --target "$GITHUB_SHA"
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout --orphan jar && git rm -rf . -q && cp /tmp/monk.jar . && git add monk.jar
          git commit -qm "jar for ${GITHUB_SHA::7}" && git push -f origin jar
